<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e16" />
    <meta name="color-scheme" content="dark" />
    <title>Legends Clash — duelo de cartas em tempo real</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
    <!-- Direção tipográfica medieval/editorial:
         Cinzel Decorative → títulos cerimoniais e elementos de destaque;
         Cinzel → títulos compactos (ex.: nome de carta), legível em corpo pequeno;
         Mozilla Text → corpo, descrições, subtítulos e detalhes (sans-serif de leitura limpa). -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Mozilla+Text:wght@400..700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Mozilla+Text:wght@400..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cinzel+Decorative:wght@400;700;900&family=Mozilla+Text:wght@400..700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      html, body, #root { min-height: 100%; }
      body {
        margin: 0;
        background: #080d15;
        color: #f3e7c0;
        font-family: "Mozilla Text", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(227, 179, 65, 0.16), transparent 34rem),
          linear-gradient(180deg, #101827, #070b12 70%);
      }
      .boot-loader__mark {
        display: grid;
        gap: 12px;
        justify-items: center;
        text-transform: uppercase;
        letter-spacing: 0;
        font-size: 13px;
        font-weight: 800;
        width: min(280px, calc(100vw - 48px));
      }
      .boot-loader__sigil {
        width: 62px;
        height: 62px;
        border: 1px solid rgba(227, 179, 65, 0.7);
        border-radius: 50%;
        box-shadow: 0 0 28px rgba(227, 179, 65, 0.24), inset 0 0 22px rgba(77, 141, 255, 0.16);
        animation: bootPulse 1.3s ease-in-out infinite;
      }
      .boot-loader__bar {
        width: 100%;
        height: 6px;
        border: 1px solid rgba(227, 179, 65, 0.34);
        border-radius: 99px;
        background: rgba(5, 9, 18, 0.72);
        overflow: hidden;
        box-shadow: inset 0 1px 5px rgba(0, 0, 0, 0.55);
      }
      .boot-loader__bar i {
        display: block;
        width: 8%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4d8dff, #e3b341);
        transition: width 180ms ease;
      }
      .boot-loader__detail {
        min-height: 1.2em;
        color: #9fb0c4;
        font-size: 11px;
        font-weight: 700;
        text-transform: none;
      }
      @keyframes bootPulse {
        0%, 100% { transform: scale(0.96); opacity: 0.72; }
        50% { transform: scale(1.04); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="boot-loader__mark">
          <span class="boot-loader__sigil"></span>
          <span data-boot-label>Preparando arena</span>
          <span class="boot-loader__bar" aria-hidden="true"><i data-boot-bar></i></span>
          <span class="boot-loader__detail" data-boot-detail>Carregando recursos essenciais</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
